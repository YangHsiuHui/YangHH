<script>

const industryIcons = {

    "奶茶店":       "🧋",
    "大賣場":       "🛒",
    "電影院":       "🎬",
    "美容館":       "💆",
    "飯店":         "🏨",
    "醫院":         "🏥",
    "網吧":         "💻",
    "智慧手機專賣店": "📱",
    "物流中心":     "🚚",
    "銀行":         "🏦",
    "建設公司":     "🏗️",
    "科技園區":     "🌆"
};

const VULN_CATALOG = [
    {
        code: "CVE-WEB-001",
        title: "DOM XSS 輸出跳脫檢核缺失",
        severity: "high",
        penalty: 18,
        patchCost: 5e15,

    },
    {

        title: "Content-Security-Policy (CSP) 標頭未強化",
        severity: "med",
        penalty: 12,
        patchCost: 3e15,
        desc: "建議限制內聯腳本與外部資源來源以降低注入面。"
    },
    {
        code: "CVE-AUTH-003",
        title: "產業金流 API 速率限制過寬",
        severity: "high",
        penalty: 16,
        patchCost: 8e15,
        desc: "高頻交易接口缺乏節流機制，易遭自動化撞庫或重放。"
    },
    {

    {

        severity: "low",
        penalty: 6,
        patchCost: 1e15,
        desc: "偵測到舊版前端模組存在已知低風險資訊揭露。"
    },
    {
        code: "CVE-NET-006",
        title: "HTTPS / HSTS 傳輸層安全降級風險",
        severity: "med",
        penalty: 11,
        patchCost: 4e15,
        desc: "未強制啟用嚴格傳輸安全策略，存在中間人竊聽風險。"
    }
];

let money = 0n;
let nextEmpId = 0;
let renderLock = false;
let employees = [];
let industries = {};
let projects = [];
let securityState = null;
let lastEduSummary = "尚未派駐員工至學校教育";
window.usedNames = new Set();

function escapeHtml(str){
    return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
}

function createInitialIndustries(){
    return {
        "學校教育": {lv:1, cap:5, emp:[], base:1.5e16},
        "奶茶店":   {lv:1, cap:5, emp:[], base:3e15},
        "大賣場":   {lv:1, cap:5, emp:[], base:5e15},
        "電影院":   {lv:1, cap:5, emp:[], base:8e15},
        "美容館":   {lv:1, cap:5, emp:[], base:6e15},
        "飯店":     {lv:1, cap:5, emp:[], base:1e16},
        "醫院":     {lv:1, cap:5, emp:[], base:2e16},
        "網吧":     {lv:1, cap:5, emp:[], base:7e15}
    };
}

function createInitialProjects(){
    return [
        {name:"📱智慧手機", cost:1e16, prog:0, unlock:"智慧手機專賣店"},
        {name:"🚲腳踏車AI", cost:5e16, prog:0, unlock:"物流中心"},
        {name:"💱數位貨幣", cost:2e17, prog:0, unlock:"銀行"},
        {name:"🏠房地產AI", cost:5e17, prog:0, unlock:"建設公司"},
        {name:"🚗無人車AI", cost:2e18, prog:0, unlock:"科技園區"}
    ];
}

function createInitialSecurity(){
    return {
        secLv: 1,
        scanCount: 1,
        patchedTotal: 0,
        lastScanAt: new Date().toISOString(),
        autoSoc: false,
        vulns: [
            {...VULN_CATALOG[0], id: 1},
            {...VULN_CATALOG[3], id: 2}
        ],
        nextVulnId: 3,
        logs: [
            "系統初始化完成，建議立即執行弱點掃描並修補高風險漏洞。"
        ]
    };
}

function makeName(){
    let name;
    let guard = 0;
    do{
        name =
            last[Math.floor(Math.random()*last.length)] +
            mid[Math.floor(Math.random()*mid.length)] +
            end[Math.floor(Math.random()*end.length)];
        guard++;
    }while(window.usedNames.has(name) && guard < 2000);

    if(window.usedNames.has(name)){
        name = name + "_" + (nextEmpId + 1);
    }

    window.usedNames.add(name);
    return name;
}

function trait(){
    return ["⚡效率","🧠商業","🛠技術"][Math.floor(Math.random()*3)];
}

function createEmployeeObj(){
    return {
        id: nextEmpId++,
        name: makeName(),
        lv: 1,
        exp: 0,
        energy: 100,
        kp: 0,
        trait: trait(),
        industry: null
    };
}

function initNewGameState(){
    money = BigInt("9".repeat(120)); // 120個9
    nextEmpId = 0;
    window.usedNames = new Set();
    industries = createInitialIndustries();
    projects = createInitialProjects();
    employees = Array.from({length: DEFAULT_EMP_COUNT}, ()=>createEmployeeObj());
    securityState = createInitialSecurity();
    lastEduSummary = "尚未派駐員工至學校教育";
}

function formatTimeLabel(date = new Date()){
    return date.toTimeString().slice(0, 8);
}

function updateSaveStatus(text){
    const el = document.getElementById("saveStatus");
    if(el) el.innerText = text;
}

function buildSavePayload(){
    const serializedIndustries = {};
    for(let k in industries){
        const ind = industries[k];
        serializedIndustries[k] = {
            lv: ind.lv,
            cap: ind.cap,
            base: ind.base,
            empIds: ind.emp.map(e => e.id)
        };
    }

    return {
        version: 4,
        savedAt: new Date().toISOString(),
        money: money.toString(),
        nextEmpId,
        usedNames: Array.from(window.usedNames),
        employees,
        industries: serializedIndustries,
        projects,
        securityState,
        lastEduSummary
    };
}

function applySaveData(data){
    if(!data || !Array.isArray(data.employees) || !data.industries){
        return false;
    }

    const rawMoney = String(data.money ?? ("9".repeat(120))).trim();
    const parsedMoney = BigInt(rawMoney);

    money = parsedMoney;
    employees = data.employees.map((e, idx) => ({
        id: typeof e.id === "number" ? e.id : idx,
        name: e.name || ("員工" + (idx + 1)),
        lv: e.lv || 1,
        exp: e.exp || 0,
        energy: typeof e.energy === "number" ? e.energy : 100,
        kp: e.kp || 0,
        trait: e.trait || trait(),
        industry: null
    }));

    const maxId = employees.reduce((m, e) => Math.max(m, e.id), -1);
    nextEmpId = typeof data.nextEmpId === "number" ? Math.max(data.nextEmpId, maxId + 1) : maxId + 1;

    window.usedNames = new Set(Array.isArray(data.usedNames) ? data.usedNames : employees.map(e => e.name));

    const empMap = new Map(employees.map(e => [e.id, e]));
    const restoredIndustries = {};

    for(let k in data.industries){
        const savedInd = data.industries[k];
        const empList = [];
        if(Array.isArray(savedInd.empIds)){
            savedInd.empIds.forEach(eid => {
                const empObj = empMap.get(eid);
                if(empObj && !empList.some(x => x.id === eid)){
                    empObj.industry = k;
                    empList.push(empObj);
                }
            });
        }
        restoredIndustries[k] = {
            lv: savedInd.lv || 1,
            cap: savedInd.cap || 5,
            emp: empList,
            base: savedInd.base || 3e15
        };
    }

    const defaults = createInitialIndustries();
    for(let k in defaults){
        if(!restoredIndustries[k]){
            restoredIndustries[k] = defaults[k];
        }
    }
    industries = restoredIndustries;

    projects = Array.isArray(data.projects) && data.projects.length > 0
        ? data.projects.map(p => ({
            name: p.name || "科技專案",
            cost: p.cost || 1e16,
            prog: Math.min(100, Math.max(0, Number(p.prog) || 0)),
            unlock: p.unlock || ""
        }))
        : createInitialProjects();

    securityState = data.securityState && Array.isArray(data.securityState.vulns)
        ? data.securityState
        : createInitialSecurity();

    if(typeof data.lastEduSummary === "string"){
        lastEduSummary = data.lastEduSummary;
    }

    return true;
}

function encodeBackupString(payload){
    const jsonStr = JSON.stringify(payload);
    const bytes = new TextEncoder().encode(jsonStr);
    let bin = "";
    for(let i = 0; i < bytes.length; i++){
        bin += String.fromCharCode(bytes[i]);
    }
    return btoa(bin);
}

function decodeBackupString(input){
    const trimmed = String(input || "").trim();
    if(!trimmed) throw new Error("空白內容");

    if(trimmed.startsWith("{")){
        return JSON.parse(trimmed);
    }

    const bin = atob(trimmed);
    const bytes = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++){
        bytes[i] = bin.charCodeAt(i);
    }
    const jsonStr = new TextDecoder().decode(bytes);
    return JSON.parse(jsonStr);
}

function closeIoModal(){
    const modal = document.getElementById("saveIoModal");
    if(modal) modal.style.display = "none";
}

function openExportModal(){
    saveGame(false);
    const payload = buildSavePayload();
    const encoded = encodeBackupString(payload);

    document.getElementById("ioModalTitle").innerText = "📤 匯出遊戲存檔";
    document.getElementById("ioModalDesc").innerText = "請複製下方備份字串妥善保存；之後可使用「匯入存檔」還原進度。";
    const ta = document.getElementById("ioTextarea");
    ta.readOnly = true;
    ta.value = encoded;

    document.getElementById("ioModalActions").innerHTML = `
        <button class="save-btn" onclick="copyExportText()">一鍵複製</button>
        <button onclick="closeIoModal()">關閉</button>
    `;

    document.getElementById("saveIoModal").style.display = "flex";
    ta.focus();
    ta.select();
}

function copyExportText(){
    const ta = document.getElementById("ioTextarea");
    ta.select();
    if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(ta.value).then(()=>{
            alert("✅ 已複製存檔備份字串到剪貼簿！");
        }).catch(()=>{
            document.execCommand("copy");
            alert("✅ 已選取並嘗試複製存檔備份字串！");
        });
    }else{
        document.execCommand("copy");
        alert("✅ 已複製存檔備份字串！");
    }
}

function openImportModal(){
    document.getElementById("ioModalTitle").innerText = "📥 匯入遊戲存檔";
    document.getElementById("ioModalDesc").innerText = "請將先前匯出的存檔字串貼入下方，確認後將覆蓋目前進度並自動存檔。";
    const ta = document.getElementById("ioTextarea");
    ta.readOnly = false;
    ta.value = "";

    document.getElementById("ioModalActions").innerHTML = `
        <button class="save-btn" onclick="confirmImportBackup()">確認匯入</button>
        <button onclick="closeIoModal()">取消</button>
    `;

    document.getElementById("saveIoModal").style.display = "flex";
    ta.focus();
}

function confirmImportBackup(){
    const rawText = document.getElementById("ioTextarea").value;
    try{
        const data = decodeBackupString(rawText);
        if(!applySaveData(data)){
            return alert("⚠️ 存檔格式不完整，無法匯入！");
        }
        saveGame(false);
        updateSaveStatus("📥 已匯入存檔：" + formatTimeLabel());
        closeIoModal();
        fastRender();
        alert("✅ 存檔匯入成功！");
    }catch(err){
        console.error("匯入存檔失敗：", err);
        alert("⚠️ 存檔字串無效或已損毀，請確認是否完整複製。");
    }
}

function saveGame(showAlert = false){
    try{
        const payload = buildSavePayload();
        localStorage.setItem(SAVE_KEY, JSON.stringify(payload));
        updateSaveStatus("💾 已存檔：" + formatTimeLabel());
        if(showAlert) alert("✅ 遊戲進度已手動存檔！");
    }catch(err){
        console.error("存檔失敗：", err);
        updateSaveStatus("⚠️ 存檔失敗");
        if(showAlert) alert("⚠️ 存檔失敗，可能是瀏覽器儲存空間不足。");
    }
}

function loadGame(){
    try{
        const raw = localStorage.getItem(SAVE_KEY);
        if(!raw) return false;

        const data = JSON.parse(raw);
        if(!applySaveData(data)){
            return false;
        }

        if(data.savedAt){
            updateSaveStatus("💾 已讀取存檔：" + formatTimeLabel(new Date(data.savedAt)));
        }
        return true;
    }catch(err){
        console.error("讀取存檔失敗：", err);
        return false;
    }
}

function manualSave(){
    saveGame(true);
}

function resetGame(){
    if(!confirm("確定要重置遊戲嗎？目前的存檔與進度將會清除，並恢復預設 40 名工作人員。")) return;
    localStorage.removeItem(SAVE_KEY);
    initNewGameState();
    saveGame(false);
    updateSaveStatus("🔄 已重置並建立新存檔：" + formatTimeLabel());
    fastRender();
}

function toBigIntAmount(n){
    if(typeof n === "bigint") return n;
    if(typeof n === "number"){
        if(!Number.isFinite(n) || n <= 0) return 0n;
        return BigInt(Math.floor(n));
    }
    return BigInt(n);
}

function formatMoney(n){
    n = BigInt(n);

    const trillion = 10n**12n;
    const quadrillion = 10n**16n;
    const quintillion = 10n**20n;

    if(n >= quintillion) return "US$ " + Number(n/quintillion) + " 垓";
    if(n >= quadrillion) return "US$ " + Number(n/quadrillion) + " 京";
    if(n >= trillion) return "US$ " + Number(n/trillion) + " 兆";
    if(n >= 10n**8n) return "US$ " + Number(n/(10n**8n)) + " 億";
    if(n >= 10n**4n) return "US$ " + Number(n/(10n**4n)) + " 萬";

    return "US$ " + n.toString();
}

function formatSpeed(n){
    return formatMoney(n) + " / 秒";
}

function fastRender(){
    if(renderLock) return;
    renderLock = true;
    requestAnimationFrame(()=>{
        renderLock = false;
        renderAll();
    });
}

function companyLv(){
    return Math.max(1, Math.floor(Number(money.toString().length)/2));
}

function getSecurityScore(){
    if(!securityState) return 100;
    const totalPenalty = securityState.vulns.reduce((sum, v) => sum + (v.penalty || 0), 0);
    return Math.max(0, Math.min(100, 100 - totalPenalty));
}

function getIndustryIncome(ind){
    return toBigIntAmount(ind.emp.length) * toBigIntAmount(ind.lv) * toBigIntAmount(ind.base);
}

function getUpgradeCost(ind){
    return toBigIntAmount(ind.lv) * 20000000000000000n; // 2e16
}

function renderAll(){
    document.getElementById("money").innerText = formatMoney(money);
    document.getElementById("empCount").innerText = employees.length;
    document.getElementById("companyLv").innerText = companyLv();
    document.getElementById("secScoreHeader").innerText = getSecurityScore();
    renderIndustry();
    renderEmployee();
    renderProject();
    renderSecurity();
}

function renderIndustry(){
    let html = "";
    for(let k in industries){
        let ind = industries[k];
        let income = getIndustryIncome(ind);
        let upCost = getUpgradeCost(ind);
        let icon = industryIcons[k] || "🏬";
        let eduExtra = "";

        if(k === "學校教育"){
            const gainPerTick = ind.emp.length * 10 + ind.lv * 5;
            eduExtra = `<div class="small edu-tag">🎓 每5秒自動培育：在職與全體員工 +${gainPerTick} 經驗（${escapeHtml(lastEduSummary)}）</div><br>`;
        }

        html += `
        <div class="card">
        <b>${icon} ${escapeHtml(k)} Lv.${ind.lv}</b> (${ind.emp.length}/${ind.cap})<br><br>
        💹 產業轉速：<span class="speed">${formatSpeed(income)}</span><br><br>
        💵 單位產值：${formatMoney(toBigIntAmount(ind.base))}<br><br>
        🔧 升級費用：<span class="money">${formatMoney(upCost)}</span><br><br>
        ${eduExtra}
        <button onclick="upgradeInd('${escapeHtml(k)}')">升級產業</button>
        </div>`;
    }
    document.getElementById("industries").innerHTML = html;
}

function renderEmployee(){
    let html = "";
    [...employees].sort((a,b)=>b.kp - a.kp).forEach(e=>{
        html += `
        <div class="card">
        <b>${escapeHtml(e.name)}</b> Lv.${e.lv} ${escapeHtml(e.trait)}<br><br>
        ⚡ 能量：${e.energy}（訓練不扣能量）<br>
        ✨ 經驗：${e.exp}/100<br>
        📈 KPI：${e.kp}<br>
        🏢 部門：${escapeHtml(e.industry || "待命")}<br><br>
        <button onclick="train(${e.id})">訓練</button>
        <button onclick="aiAssign(${e.id})">AI分配</button>
        </div>`;
    });
    document.getElementById("employees").innerHTML = html;
}

function renderProject(){
    let html = "";
    projects.forEach((p,i)=>{
        const unlocked = Boolean(industries[p.unlock]);
        html += `
        <div class="card">
        <b>${escapeHtml(p.name)}</b><br><br>
        💰 成本：${formatMoney(toBigIntAmount(p.cost))}<br><br>
        📊 進度：${p.prog}%<br><br>
        🔓 解鎖：${escapeHtml(p.unlock)} ${unlocked ? "✅（已解鎖）" : ""}<br><br>
        <button onclick="work(${i})">${p.prog >= 100 && unlocked ? "繼續投入研發" : "研發"}</button>
        </div>`;
    });
    document.getElementById("projects").innerHTML = html;
}

function severityBadge(sev){
    if(sev === "high") return `<span class="badge-high">高風險</span>`;
    if(sev === "med") return `<span class="badge-med">中風險</span>`;
    return `<span class="badge-low">低風險</span>`;
}

function renderSecurity(){
    const score = getSecurityScore();
    const socBtn = document.getElementById("socToggleBtn");
    if(socBtn){
        socBtn.innerText = securityState.autoSoc ? "🟢 自動SOC巡檢：開啟中" : "開啟自動SOC巡檢";
    }

    let statusText = score >= 90 ? "🟢 安全優良" : (score >= 70 ? "🟡 尚可（建議修補）" : "🔴 高危警戒");
    let lastTime = securityState.lastScanAt ? formatTimeLabel(new Date(securityState.lastScanAt)) : "--:--:--";

    let html = `
    <div class="sec-card">
        <b>📊 資安健康總覽：${statusText}</b><br>
        <div class="score-bar"><div class="score-fill" style="width:${score}%"></div></div>
        🛡️ 防護評分：<b>${score} / 100</b>｜資安等級：<b>Lv.${securityState.secLv}</b><br>
        🔎 累計弱掃次數：${securityState.scanCount} 次｜已修補漏洞：${securityState.patchedTotal} 個<br>
        🕒 最近弱掃時間：${lastTime}
    </div>`;

    if(securityState.vulns.length === 0){
        html += `
        <div class="sec-card">
            ✅ <b>目前未偵測到已知弱點！</b><br>
            <span class="small">所有網頁與產業介面皆通過最新弱掃檢核。</span>
        </div>`;
    }else{
        securityState.vulns.forEach(v => {
            html += `
            <div class="sec-card">
                ${severityBadge(v.severity)} <b>[${escapeHtml(v.code)}] ${escapeHtml(v.title)}</b><br>
                <span class="small">${escapeHtml(v.desc)}</span><br><br>
                📉 評分影響：-${v.penalty} 分｜🔧 修補成本：<span class="money">${formatMoney(toBigIntAmount(v.patchCost))}</span><br>
                <button class="patch-btn" onclick="patchVuln(${v.id})">立即修補漏洞</button>
            </div>`;
        });
    }

    if(Array.isArray(securityState.logs) && securityState.logs.length > 0){
        html += `<div class="sec-card"><b>📜 弱掃與資安事件紀錄</b><br>`;
        securityState.logs.slice(0, 5).forEach(log => {
            html += `<div class="small">• ${escapeHtml(log)}</div>`;
        });
        html += `</div>`;
    }

    document.getElementById("securityPanel").innerHTML = html;
}

function addSecurityLog(msg){
    securityState.logs.unshift(`[${formatTimeLabel()}] ${msg}`);
    if(securityState.logs.length > 15){
        securityState.logs.length = 15;
    }
}

function runVulnScan(manual = false){
    securityState.scanCount++;
    securityState.lastScanAt = new Date().toISOString();

    const existingCodes = new Set(securityState.vulns.map(v => v.code));
    const candidates = VULN_CATALOG.filter(v => !existingCodes.has(v.code));

    if(candidates.length > 0 && (manual || Math.random() < 0.65)){
        const picked = candidates[Math.floor(Math.random() * candidates.length)];
        securityState.vulns.push({
            ...picked,
            id: securityState.nextVulnId++
        });
        addSecurityLog(`弱掃發現新弱點 [${picked.code}] ${picked.title}`);
        if(manual){
            alert(`🔍 弱點掃描完成！發現 1 項新弱點：\n[${picked.code}] ${picked.title}`);
        }
    }else{
        addSecurityLog("弱掃完成，未發現新增弱點。");
        if(manual){
            alert("🔍 弱點掃描完成！本次未發現新增弱點。");
        }
    }

    fastRender();
}

function patchVuln(vulnId){
    const idx = securityState.vulns.findIndex(v => v.id === vulnId);
    if(idx === -1) return;

    const target = securityState.vulns[idx];
    const cost = toBigIntAmount(target.patchCost);
    if(money < cost) return alert("資金不足，無法進行資安修補！");

    money -= cost;
    securityState.vulns.splice(idx, 1);
    securityState.patchedTotal++;
    if(securityState.patchedTotal % 2 === 0){
        securityState.secLv++;
    }

    employees.forEach(e => { e.kp += 2; });
    addSecurityLog(`已修補弱點 [${target.code}] ${target.title}，全體員工 KPI +2`);
    fastRender();
}

function patchAllVulns(){
    if(securityState.vulns.length === 0){
        return alert("✅ 目前沒有需要修補的漏洞！");
    }

    let patched = 0;
    while(securityState.vulns.length > 0){
        const target = securityState.vulns[0];
        const cost = toBigIntAmount(target.patchCost);
        if(money < cost) break;

        money -= cost;
        securityState.vulns.shift();
        securityState.patchedTotal++;
        if(securityState.patchedTotal % 2 === 0){
            securityState.secLv++;
        }
        patched++;
    }

    if(patched === 0){
        return alert("資金不足以修補目前任何漏洞！");
    }

    employees.forEach(e => { e.kp += patched * 2; });
    addSecurityLog(`一鍵修補完成，共修復 ${patched} 項漏洞！`);
    fastRender();
}

function toggleAutoSoc(){
    securityState.autoSoc = !securityState.autoSoc;
    addSecurityLog(securityState.autoSoc ? "已開啟自動 SOC 24H 資安巡檢與自動防禦" : "已關閉自動 SOC 巡檢");
    fastRender();
}

function recruitEmployee(){
    const cost = 10000000n; // 1000萬美金
    if(money < cost) return alert("資金不足");

    money -= cost;
    employees.push(createEmployeeObj());
    fastRender();
}

function findAvailableIndustry(){
    for(let k in industries){
        if(industries[k].emp.length < industries[k].cap){
            return k;
        }
    }
    return null;
}

function aiAssign(id){
    let e = employees.find(x => x.id === id);
    if(!e) return;

    let best = findAvailableIndustry();
    if(!best) return alert("目前所有產業人數皆已滿編！");

    for(let k in industries){
        industries[k].emp = industries[k].emp.filter(x => x.id !== id);
    }

    industries[best].emp.push(e);
    e.industry = best;
    fastRender();
}

function aiAssignAll(){
    let assignedCount = 0;

    for(let e of employees){
        if(e.industry && industries[e.industry]){
            continue;
        }

        let best = findAvailableIndustry();
        if(!best) break;

        for(let k in industries){
            industries[k].emp = industries[k].emp.filter(x => x.id !== e.id);
        }

        industries[best].emp.push(e);
        e.industry = best;
        assignedCount++;
    }

    if(assignedCount === 0){
        alert("沒有可分配的新空缺（可能所有員工皆已分配或產業已滿編）。");
    }

    fastRender();
}

function addExpToEmployee(e, expGain, kpGain = 0){
    e.exp += expGain;
    e.kp += kpGain;
    let leveled = 0;

    while(e.exp >= 100){
        e.lv++;
        e.exp -= 100;
        leveled++;
    }
    return leveled;
}

function applyTrainGain(e){
    addExpToEmployee(e, 25, 5);
}

function train(id){
    let e = employees.find(x => x.id === id);
    if(!e) return;

    applyTrainGain(e);
    fastRender();
}

function trainAll(){
    if(employees.length === 0) return alert("目前沒有員工可訓練！");

    for(let e of employees){
        applyTrainGain(e);
    }

    fastRender();
}

function runSchoolEducationTick(){
    const edu = industries["學校教育"];
    if(!edu || edu.emp.length === 0){
        lastEduSummary = "目前無員工在職";
        return;
    }

    const staffGain = edu.emp.length * 15 + edu.lv * 8;
    const allStaffGain = edu.emp.length * 8 + edu.lv * 4;
    let levelUpCount = 0;

    edu.emp.forEach(staff => {
        const empObj = employees.find(x => x.id === staff.id);
        if(empObj){
            levelUpCount += addExpToEmployee(empObj, staffGain, 2);
        }
    });

    employees.forEach(emp => {
        levelUpCount += addExpToEmployee(emp, allStaffGain, 1);
    });

    lastEduSummary = `上次於 ${formatTimeLabel()} 培育 ${employees.length} 人${levelUpCount > 0 ? "（升等 " + levelUpCount + " 次）" : ""}`;
    fastRender();
}

function applySingleIndustryUpgrade(ind){
    let cost = getUpgradeCost(ind);
    if(money < cost) return false;

    money -= cost;
    ind.lv++;
    ind.cap++;
    ind.base = ind.base * 1.6;
    return true;
}

function upgradeInd(name){
    let ind = industries[name];
    if(!ind) return;

    if(!applySingleIndustryUpgrade(ind)){
        return alert("資金不足");
    }

    fastRender();
}

function upgradeAllInd(){
    let upgradedCount = 0;

    for(let k in industries){
        if(applySingleIndustryUpgrade(industries[k])){
            upgradedCount++;
        }
    }

    if(upgradedCount === 0){
        return alert("目前資金不足以升級任何產業！");
    }

    fastRender();
}

function work(i){
    let p = projects[i];
    if(!p) return;

    let cost = toBigIntAmount(p.cost);
    if(money < cost) return alert("資金不足");

    money -= cost;
    p.prog = Math.min(100, p.prog + 20);

    if(p.prog >= 100 && p.unlock && !industries[p.unlock]){
        industries[p.unlock] = {lv:1, cap:5, emp:[], base:3e16};
        alert("🔥解鎖產業：" + p.unlock);
    }

    employees.forEach(e=>{
        e.energy = Math.min(100, e.energy + 5);
        e.kp++;
    });

    fastRender();
}

// 收益計時器
setInterval(()=>{
    let totalIncome = 0n;
    for(let k in industries){
        totalIncome += getIndustryIncome(industries[k]);
    }
    const score = BigInt(Math.max(50, getSecurityScore()));
    money += (totalIncome * score) / 100n;
    fastRender();
}, 500);

// 學校教育自動培育計時器（每 5 秒一次）
setInterval(()=>{
    runSchoolEducationTick();
}, 5000);

// 定期弱掃與自動 SOC 巡檢（每 20 秒一次）
setInterval(()=>{
    if(!securityState) return;
    if(securityState.autoSoc){
        const target = securityState.vulns.find(v => v.severity !== "high");
        if(target && money >= toBigIntAmount(target.patchCost)){
            money -= toBigIntAmount(target.patchCost);
            securityState.vulns = securityState.vulns.filter(v => v.id !== target.id);
            securityState.patchedTotal++;
            addSecurityLog(`自動SOC已攔截並修補 [${target.code}] ${target.title}`);
        }else{
            addSecurityLog("自動SOC巡檢正常，持續監控企業網路安全。");
        }
        fastRender();
    }else if(securityState.vulns.length < 3 && Math.random() < 0.35){
        runVulnScan(false);
    }
}, 20000);

// 自動存檔（每 10 秒一次）
setInterval(()=>{
    saveGame(false);
}, 10000);

if(!loadGame()){
    initNewGameState();
}

renderAll();

</script>
</body>
</html>
